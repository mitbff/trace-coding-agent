[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-coding-agent"
version = "0.1.0"
description = "A small coding agent with a transparent local runtime"
requires-python = ">=3.11"
dependencies = ["openai>=1.60,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
trace-agent = "trace_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

